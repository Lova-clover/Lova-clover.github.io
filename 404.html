<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>페이지를 찾을 수 없습니다 | Han Seongju</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <style>
    :root { color-scheme: light dark; --paper: #fffaf3; --ink: #332a23; --line: #ecdcc7; --accent: #98601b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: Pretendard, system-ui, sans-serif; }
    main { width: min(100%, 440px); text-align: center; }
    img { width: 96px; height: 96px; }
    .code { color: var(--accent); font-weight: 700; letter-spacing: .12em; }
    h1 { font-size: clamp(1.3rem, 5vw, 1.7rem); line-height: 1.5; word-break: keep-all; }
    a { display: inline-block; margin-top: 16px; padding: 14px 20px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; }
    a:hover, a:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { :root { --paper: #181918; --ink: #eee9e0; --line: #494439; --accent: #ffc16b; } }
  </style>
</head>
<body>
  <main>
    <img src="/assets/favicon-192.png" width="192" height="192" alt="">
    <p class="code">404</p>
    <h1>페이지를 찾을 수 없습니다.</h1>
    <a href="/">포트폴리오 홈으로 돌아가기</a>
  </main>
</body>
</html>
